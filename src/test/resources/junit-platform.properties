cucumber.publish.quiet=true
# Tag filtering (e.g. run smoke tests, skip ignored)
cucumber.glue =stepDefinations

cucumber.filter.tags=@smoke
# Serenity / Cucumber Reporter Plugins
cucumber.plugin=pretty, html:target/cucumber-reports.html

# Enable parallel execution via Cucumber engine false or true (Parallel scenario execution inside Cucumber)
cucumber.execution.parallel.enabled = true

# Choose thread count strategy: 'fixed' or 'dynamic' always select fixed as it's control how many threads are running
cucumber.execution.parallel.config.strategy = fixed
cucumber.execution.parallel.config.fixed.parallelism = 2